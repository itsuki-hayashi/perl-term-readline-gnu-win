name: Native Windows Readline
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Perl ${{ matrix.perl }} / ${{ matrix.arch }} / VS ${{ matrix.vs }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025-vs2026
            arch: x64
            perl: '5.44.0'
            perl_sha256: 3b855066b92491cb40e86affb1ca57d1a388aa43e51b91c7806a32c2f65f96c3
            vs: 18
            toolset: '14.5'
            cctype: MSVC145
          - runner: windows-11-vs2026-arm
            arch: arm64
            perl: '5.44.0'
            perl_sha256: 3b855066b92491cb40e86affb1ca57d1a388aa43e51b91c7806a32c2f65f96c3
            vs: 18
            toolset: '14.5'
            cctype: MSVC145
    defaults:
      run:
        shell: pwsh
    env:
      LC_ALL: C
      AUTOMATED_TESTING: '1'
      RELEASE_TESTING: '1'
      TERM: win32
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select MSVC and Windows SDK
        id: compiler
        run: .github/scripts/toolchain.ps1 -Architecture '${{ matrix.arch }}' -VisualStudio ${{ matrix.vs }} -Toolset '${{ matrix.toolset }}'
      - name: Compute native dependency cache keys
        id: cache-keys
        run: |
          $native = 'native-perl-v2-${{ runner.os }}-${{ matrix.arch }}-${{ matrix.perl_sha256 }}-${{ steps.compiler.outputs.tools }}-${{ steps.compiler.outputs.sdk }}-shared-threaded-release'
          "perl=$native" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "author=author-tools-v1-$native-${{ matrix.cctype }}-${{ hashFiles('config/author-tools.json', '.github/scripts/install-author-tools.ps1', '.github/scripts/bootstrap-perl.ps1', 'patches/author/*.patch', 'inc/Gnu/Patch.pm') }}" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Cache native MSVC Perl
        id: perl-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/native-perl
          key: ${{ steps.cache-keys.outputs.perl }}
      - name: Build matching native Perl
        if: steps.perl-cache.outputs.cache-hit != 'true'
        run: .github/scripts/bootstrap-perl.ps1 -Version '${{ matrix.perl }}' -Sha256 '${{ matrix.perl_sha256 }}' -Prefix "$env:RUNNER_TEMP/native-perl" -Cctype '${{ matrix.cctype }}'
      - name: Select and verify native Perl
        run: |
          "$env:RUNNER_TEMP/native-perl/bin" | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          & "$env:RUNNER_TEMP/native-perl/bin/perl.exe" -MConfig -e 'die "Wrong compiler" unless $Config{cc} eq "cl"; die "Wrong architecture" unless $Config{archname} =~ /MSWin32-${{ matrix.arch }}-/; print "$^V $Config{archname}\n"'
          if ($LASTEXITCODE) { throw 'Wrong native Perl configuration' }
      - name: Build native backend
        run: |
          perl Makefile.PL
          if ($LASTEXITCODE) { throw 'Configuration failed' }
          nmake /nologo
          if ($LASTEXITCODE) { throw 'Build failed' }
      - name: Test author installer contracts
        run: .github/scripts/test-author-tools.ps1
      - name: Restore tested Perl author tools
        id: author-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/author
          key: ${{ steps.cache-keys.outputs.author }}
      - name: Install and verify pinned Perl author tools
        if: steps.author-cache.outputs.cache-hit != 'true'
        env:
          AUTHOR_TOOLS_CACHE_KEY: ${{ steps.cache-keys.outputs.author }}
        run: .github/scripts/install-author-tools.ps1
      - name: Verify restored Perl author tools
        if: steps.author-cache.outputs.cache-hit == 'true'
        env:
          AUTHOR_TOOLS_CACHE_KEY: ${{ steps.cache-keys.outputs.author }}
        run: .github/scripts/install-author-tools.ps1 -VerifyOnly
      - name: Save tested Perl author tools
        if: success() && steps.author-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/author
          key: ${{ steps.cache-keys.outputs.author }}
      - name: Enforce Perl formatting, static analysis, POD and compilation
        run: |
          perl script/check-perl.pl
          if ($LASTEXITCODE) { throw 'Perl quality checks failed' }
      - name: Test and prepare archive
        run: |
          nmake /nologo test
          if ($LASTEXITCODE) { throw 'Checkout tests failed' }
          perl script/release.pl
          if ($LASTEXITCODE) { throw 'Release checks failed' }
      - name: Require 100% Perl statement and branch coverage
        run: |
          perl script/coverage-perl.pl --require-full
          if ($LASTEXITCODE) { throw 'Perl coverage checks failed' }
      - name: Rebuild and test extracted source archive
        run: |
          perl script/test-archive.pl
          if ($LASTEXITCODE) { throw 'Archive installation failed' }
      - name: Upload test evidence and candidate archive
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: readline-${{ matrix.arch }}-perl-${{ matrix.perl }}-vs${{ matrix.vs }}
          path: |
            dist/
            build/**/*.log
            build/**/*.json
            build/**/*.txt
          if-no-files-found: warn
